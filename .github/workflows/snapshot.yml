name: Price snapshot

# The whole backend. Every 10 minutes keeps the board turning over and gives
# the client a recent floor when a user's browser cannot reach a price source.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch prices and roll the slate
        run: node tools/snapshot.mjs

      - name: Verify scoring still reproduces the fixtures
        run: node --test "verify/*.test.mjs"

      - name: Commit published data
        run: |
          git config user.name  "cutline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
