name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Golden scoring tests
        run: node --test "verify/*.test.mjs"

      - name: Architectural invariants
        run: node verify/lint-constraints.mjs

      - name: Modules parse
        run: |
          for f in $(find site/js -name '*.js'); do
            node --input-type=module --eval "await import('./$f')" >/dev/null 2>&1 || \
            node --check "$f"
          done
          echo "✓ all modules parse"
